name: Linux packages
on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb-appimage:
    runs-on: ubuntu-22.04   # older glibc: the AppImage runs on more systems
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y nasm libsqlite3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libudev-dev libfuse2 file
      - name: .deb and tarball
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          (cd build && cpack -G "DEB;TGZ")
          mkdir -p out && cp build/thc_*.deb build/thc-*.tar.gz out/
      - name: AppImage
        run: BUILD_DIR=$PWD/build packaging/appimage/build.sh && cp build/THC-*.AppImage out/
      - uses: actions/upload-artifact@v4
        with: { name: deb-appimage, path: out/* }

  alpine:
    runs-on: ubuntu-latest
    container: alpine:edge
    steps:
      - run: apk add --no-cache git alpine-sdk cmake samurai nasm sdl3-dev sqlite-dev linux-headers tar
      - uses: actions/checkout@v5
      - name: Build .apk with the APKBUILD
        run: |
          git config --global --add safe.directory "$PWD"
          git archive --prefix=THC-0.1.0/ -o /tmp/thc-0.1.0.tar.gz HEAD
          mkdir -p /tmp/apk && cp packaging/alpine/APKBUILD /tmp/apk/
          cp /tmp/thc-0.1.0.tar.gz /tmp/apk/
          sed -i 's|^source=.*|source="thc-0.1.0.tar.gz"|' /tmp/apk/APKBUILD
          cd /tmp/apk
          abuild-keygen -an
          cp ~/.abuild/*.rsa.pub /etc/apk/keys/
          abuild -F checksum
          abuild -F -r -P /tmp/repo
          mkdir -p $GITHUB_WORKSPACE/out
          find /tmp/repo -name 'thc-*.apk' -exec cp {} $GITHUB_WORKSPACE/out/thc-0.1.0-r0-alpine-x86_64.apk \;
      - uses: actions/upload-artifact@v4
        with: { name: alpine, path: out/* }

  void:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - run: |
          xbps-install -Syu xbps || true
          xbps-install -Syu
          xbps-install -y git base-devel cmake ninja nasm pkg-config SDL3-devel sqlite-devel
      - uses: actions/checkout@v5
      - name: Build .xbps
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=/tmp/destdir cmake --install build
          mkdir -p out && cd out
          xbps-create -A x86_64 -n thc-0.1.0_1 -s "Lightweight player for the music and videos you already have" \
            -l Unlicense -H https://github.com/Doggydoggywhatnow/THC -D "mpv>=0 sqlite>=0" /tmp/destdir
          ls -l
      - uses: actions/upload-artifact@v4
        with: { name: void, path: out/*.xbps }

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: snapcore/action-build@v1
        id: snap
      - run: mkdir -p out && cp ${{ steps.snap.outputs.snap }} out/
      - uses: actions/upload-artifact@v4
        with: { name: snap, path: out/* }

  publish:
    # Commits the built packages to downloads/ on dev so the README can link
    # to them directly (no GitHub login needed). Pushes by GITHUB_TOKEN do
    # not start new workflow runs.
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: [deb-appimage, alpine, void, snap]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { ref: dev }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Commit packages
        run: |
          mkdir -p downloads
          cp dist/thc_0.1.0_amd64.deb dist/THC-*.AppImage dist/*.xbps dist/thc-0.1.0-linux-x86_64.tar.gz downloads/
          cp dist/thc-0.1.0-r0-alpine-x86_64.apk downloads/
          cp dist/*.snap downloads/thc_0.1.0_amd64.snap
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads
          git diff --cached --quiet || git commit -m "Update packages [skip ci]"
          git pull --rebase origin dev
          git push origin dev
